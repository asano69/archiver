services:
  archiver:
    image: ghcr.io/asano69/archiver:latest
    container_name: archiver
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - archiver.env
    volumes:
      - ./data:/archiver/pb_data
        #- /etc/ssl/certs/root_ca.crt:/certs/root_ca.crt:ro # optional
    environment:
      - TZ=Etc/UTC
      #
      - ARCHIVER_SERVER_HOST=0.0.0.0
      - ARCHIVER_SERVER_PORT=3000
      - ARCHIVER_DATA_DIR=pb_data
      #
      #- INITIAL_ADMIN_EMAIL=admin@mail.internal # default
      #- INITIAL_ADMIN_PASSWORD=password # default
volumes:
  data:
